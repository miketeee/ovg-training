<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17202a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OVG">
<meta name="robots" content="noindex, nofollow">
<title>OVG Training</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/today">OVG Training</a>
  <a class="chip" id="chip" href="#/sync" data-state="idle"><span class="dot"></span><span id="chip-text">Starting…</span></a>
  <div class="chalkline" id="chalkline" hidden><i></i></div>
</header>

<main id="view" tabindex="-1">
  <noscript><p>This app needs JavaScript turned on.</p></noscript>
</main>

<nav class="nav" aria-label="Main">
  <a href="#/today" data-route="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 2v4M9 2h6"/></svg>Today</a>
  <a href="#/guide" data-route="guide">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Guide</a>
  <a href="#/progress" data-route="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
  <a href="#/plan" data-route="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</a>
  <a href="#/sync" data-route="sync">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 2v5h-5M6 22v-5h5"/></svg>Sync</a>
</nav>

<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button class="btn" id="toast-btn" type="button"></button></div>
</body>
</html>
