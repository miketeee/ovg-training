<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVG Stage 1 check</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --mut:#999; --ok:#4caf50; --bad:#ef5350; --card:#1d1d1d; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  label { display:block; margin:12px 0 4px; color:var(--mut); font-size:14px; }
  input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border-radius:8px; border:1px solid #333; background:var(--card); color:var(--fg); }
  button { display:block; width:100%; margin:10px 0; padding:16px; font-size:17px; border:0; border-radius:10px; background:#2d5bd7; color:#fff; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--card); padding:12px; border-radius:8px; font-size:13px; min-height:60px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  small { color:var(--mut); }
</style>
</head>
<body>
<h1>OVG back-end check (Stage 1)</h1>
<small>Temporary test page. The real Sync panel comes in Stage 2. Nothing here is saved except on this phone.</small>

<label for="url">Web app /exec URL</label>
<input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
<label for="secret">Secret phrase</label>
<input id="secret" type="password" autocomplete="off">

<button id="ping">1. Ping</button>
<button id="badsecret">2. Ping with a wrong phrase (should fail)</button>
<button id="log">3. Send a test set (twice — 2nd should be skipped)</button>
<button id="read">4. Read logs back</button>
<button id="settings">5. Save + read a setting</button>
<pre id="out">Results show here.</pre>

<script>
const $ = id => document.getElementById(id);
try { $('url').value = localStorage.getItem('ovg_url') || ''; $('secret').value = localStorage.getItem('ovg_secret') || ''; } catch (e) {}
function save() { try { localStorage.setItem('ovg_url', $('url').value.trim()); localStorage.setItem('ovg_secret', $('secret').value); } catch (e) {} }
async function call(body, secretOverride) {
  save();
  const res = await fetch($('url').value.trim(), {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ secret: secretOverride ?? $('secret').value }, body))
  });
  return res.json();
}
function show(title, obj, good) {
  $('out').innerHTML = `<span class="${good ? 'ok' : 'bad'}">${good ? '✔' : '✘'} ${title}</span>\n` +
    JSON.stringify(obj, null, 2).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
}
async function run(title, fn) {
  $('out').textContent = 'Working…';
  try { const [obj, good] = await fn(); show(title, obj, good); }
  catch (e) { show(title + ' — network error (check the URL / connection)', { error: String(e) }, false); }
}
$('ping').onclick = () => run('Ping', async () => { const r = await call({ action: 'ping' }); return [r, r.ok && r.pong]; });
$('badsecret').onclick = () => run('Wrong phrase rejected', async () => { const r = await call({ action: 'ping' }, 'definitely-wrong'); return [r, r.ok === false]; });
$('log').onclick = () => run('Test set sent twice', async () => {
  const sid = 'test-' + Date.now();
  const payload = { action: 'appendLogs',
    sessions: [{ id: sid, date: new Date().toISOString().slice(0, 10), notes: 'Stage 1 test — safe to delete' }],
    sets: [{ id: sid + '-1', session_id: sid, exercise_id: 'pullups-bar-pull-ups', set_index: 1, measure: 'reps', reps: 5, effort: 7, effort_scale: 'rpe' }] };
  const a = await call(payload), b = await call(payload);
  const good = a.ok && b.ok && a.sets.accepted.length === 1 && b.sets.skipped.length === 1;
  return [{ first: a, second: b }, good];
});
$('read').onclick = () => run('Logs read', async () => { const r = await call({ action: 'getLogs' }); return [{ sessions: r.sessions?.length, sets: r.sets?.length, last_set: r.sets?.slice(-1)[0], error: r.error }, r.ok]; });
$('settings').onclick = () => run('Setting saved and read', async () => {
  await call({ action: 'setSettings', settings: { units: 'lb', effort_scale: 'rpe' } });
  const r = await call({ action: 'getSettings' });
  return [r, r.ok && r.settings && r.settings.units === 'lb'];
});
</script>
</body>
</html>
